<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#062b47">
<title>Family Fun Challenge 2026</title>
<style>
:root{--navy:#062b47;--teal:#0b9aa0;--gold:#f2b33d;--gold-2:#e29e1f;--sand:#faf5ea;--ink:#14293b;--line:#e6dfce;--serif:Georgia,serif;--sans:system-ui,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:400 1rem/1.6 var(--sans)}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;justify-content:center;padding:12px 20px;border:0;border-radius:12px;font-weight:700;cursor:pointer}
.btn-gold{background:var(--gold);color:var(--navy)}
.topbar{position:sticky;top:0;z-index:30;background:#062b47;color:#fff}.topbar-in{display:flex;justify-content:space-between;height:64px;align-items:center}
.logo{font:700 1.15rem var(--serif)}
.hero{position:relative;color:#fff;background:linear-gradient(100deg,rgba(6,43,71,.92),rgba(6,43,71,.45)),url("IMG-20261101-WA6688.jpg") center/cover #062b47}
.hero-in{display:grid;gap:32px;padding:56px 0 72px}
.head h2{font:700 2rem var(--serif);color:var(--navy)}
.offers{display:grid;gap:20px}.offer{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.offer img{aspect-ratio:16/10;object-fit:cover;width:100%}
.offer-body{padding:22px}
.row{display:flex;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sand);cursor:pointer;margin-top:8px}
.row.is-selected{border-color:var(--gold-2);background:#fff8e8}
.section{padding:72px 0}.section-sand{background:var(--sand)}
.total{display:flex;justify-content:space-between;padding:14px 16px;background:var(--navy);color:#fff;border-radius:12px;margin:16px 0}
.card{padding:24px;border:1px solid var(--line);border-radius:20px}
@media(min-width:900px){.hero-in{grid-template-columns:1.2fr .8fr}.offers{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap topbar-in"><div class="logo">Family Fun Challenge</div><a class="btn btn-gold" href="#reservation">Réserver</a></div></header>
<main>
<section class="hero"><div class="wrap hero-in"><div><h1>Family Fun Challenge 2026</h1><p>Trois jours de musique, de jeux et de rencontres en famille.</p></div></div></section>

<section class="section section-sand"><div class="wrap">
<h2>Choisissez vos formules</h2>
<div class="offers">
<article class="offer">
<img src="IMG-20261101-WA6688.jpg" alt="Afterwork">
<div class="offer-body"><h3>Last Friday Afterwork</h3><button class="row" data-item="afterwork:2"><span>2 places</span><strong>1000 FCFA</strong></button><button class="row" data-item="afterwork:4"><span>4 places</span><strong>1500 FCFA</strong></button><button class="row" data-item="afterwork:6"><span>6 places</span><strong>2000 FCFA</strong></button></div>
</article>
<article class="offer">
<img src="IMG-20261101-WA6496.jpg" alt="Famille">
<div class="offer-body"><h3>Compétition de familles</h3><button class="row" data-item="famille:1"><span>1 parent et 2 enfants</span><strong>5000 FCFA</strong></button></div>
</article>
<article class="offer">
<img src="IMG-20261101-WA0792.jpg" alt="Stands">
<div class="offer-body"><h3>Stands de vente</h3><button class="row" data-item="stand:1"><span>1 jour</span><strong>15000 FCFA</strong></button><button class="row" data-item="stand:3"><span>3 jours</span><strong>35000 FCFA</strong></button></div>
</article>
</div></div></section>

<section class="section" id="reservation"><div class="wrap"><div class="card"><h2>Réservation</h2><div class="total"><span>Total</span><strong id="total">0 FCFA</strong></div><button class="btn btn-gold" id="openReservation" style="width:100%">Réserver</button><p id="status"></p></div></div></section>
</main>

<script>
const CATALOG=[{id:'afterwork:2',price:1000,label:'Table 2'},{id:'afterwork:4',price:1500,label:'Table 4'},{id:'afterwork:6',price:2000,label:'Table 6'},{id:'famille:1',price:5000,label:'Famille'},{id:'stand:1',price:15000,label:'Stand 1j'},{id:'stand:3',price:35000,label:'Stand 3j'}];
let selected=[];
function getTotal(){return selected.reduce((a,b)=>a+b.price,0)}
function updateUI(){
 document.getElementById('total').textContent=getTotal()+' FCFA';
 document.querySelectorAll('[data-item]').forEach(b=>{b.classList.toggle('is-selected',selected.some(s=>s.id===b.dataset.item))});
}
function toggle(id){
 const item=CATALOG.find(i=>i.id===id);
 const idx=selected.findIndex(s=>s.id===id);
 if(idx>-1)selected.splice(idx,1); else selected.push(item);
 updateUI();
}
document.querySelectorAll('[data-item]').forEach(el=>el.addEventListener('click',()=>toggle(el.dataset.item)));
updateUI();
</script>
</body>
</html>
